name: Update market data (afternoon — price/technical/institutional)

on:
  schedule:
    # 17:30 Asia/Taipei (UTC+8) = 09:30 UTC, Monday–Friday. TWSE/TPEx have
    # settled the day's price, volume, and 三大法人買賣超 by then.
    - cron: "30 9 * * 1-5"
  workflow_dispatch: {} # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch afternoon data from FinMind
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: node scripts/fetch-data.mjs --scope=afternoon

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: afternoon data update ($(date -u +%Y-%m-%d))"
            git push
          fi
